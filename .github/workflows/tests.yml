name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer run for the same branch or pull request cancels the one still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # requirements-dev.txt only. tests/conftest.py stubs the CV stack and the
      # database driver, so requirements.txt is deliberately not installed.
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      # Same arguments as `make test`, without the Makefile's .venv interpreter.
      - name: Run tests
        run: python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      # `npm run build` is `tsc -b && vite build`: a type check, then the bundle.
      - name: Build
        run: npm run build
